{% extends "network/layout.html" %}

{% block body %}
    {% if user.is_authenticated %}
        <div class="border m-3">
            <form action="{% url 'add' %}" method="post" class="m-3">
                <h2>New Post</h2>
                {% csrf_token %}
                <textarea class="form-control new-post-box" placeholder="Write something!"></textarea>
                <input type="submit" class="btn btn-primary">
            </form>
        </div>
    {% endif %}
{% endblock %}
